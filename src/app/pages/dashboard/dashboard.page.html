<div class="ion-page" id="main-content">
  <ion-content [fullscreen]="true">
    <header class="dashboard-header">Your Progress</header>
    <div id="container">
      <div class="wrapper" id="wrapper">
        <main class="dashboard-panel">
          <div class="dashboard-inner">
            <div class="dashboard-subtitle">Start practicing to see your analytics</div>
          </div>

          <section class="stats-section" aria-label="Progress stats">
            <article class="stats-card">
              <div class="stats-title">Accuracy</div>
              <div class="stats-value">78%</div>
            </article>

            <article class="stats-card">
              <div class="stats-title">Streak</div>
              <div class="stats-value">5 days</div>
            </article>

            <article class="stats-card">
              <div class="stats-title">Attempts</div>
              <div class="stats-value">120</div>
            </article>
          </section>

          <section class="progress-over-time">
            <div class="progress-title">Progress Over Time</div>
            <div class="chart-container">
              <div class="chart-placeholder">
                <!-- Static SVG line chart (6 points) -->
                <svg class="chart-svg" viewBox="0 0 600 200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Accuracy over time">
                  <defs>
                    <linearGradient id="bgGrad" x1="0" x2="0" y1="0" y2="1">
                      <stop offset="0%" stop-color="#000" stop-opacity="0" />
                      <stop offset="100%" stop-color="#000" stop-opacity="0" />
                    </linearGradient>
                  </defs>
                  <!-- grid lines -->
                  <g class="grid" stroke="rgba(255,255,255,0.04)" stroke-width="1">
                    <line x1="40" y1="20" x2="560" y2="20"></line>
                    <line x1="40" y1="60" x2="560" y2="60"></line>
                    <line x1="40" y1="100" x2="560" y2="100"></line>
                    <line x1="40" y1="140" x2="560" y2="140"></line>
                    <line x1="40" y1="180" x2="560" y2="180"></line>
                  </g>

                  <!-- y-axis labels -->
                  <g class="y-labels" fill="rgba(255,255,255,0.6)" font-size="11" text-anchor="end">
                    <text x="32" y="24">80%</text>
                    <text x="32" y="64">70%</text>
                    <text x="32" y="104">60%</text>
                    <text x="32" y="144">50%</text>
                  </g>

                  <!-- x-axis labels -->
                  <g class="x-labels" fill="rgba(255,255,255,0.72)" font-size="11" text-anchor="middle">
                    <text x="40" y="196">Mon</text>
                    <text x="144" y="196">Tue</text>
                    <text x="248" y="196">Wed</text>
                    <text x="352" y="196">Thu</text>
                    <text x="456" y="196">Fri</text>
                    <text x="560" y="196">Sat</text>
                  </g>

                  <!-- data line -->
                  <polyline class="chart-line" fill="none" stroke="var(--card-border-color)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
                    points="40,93 144,70 248,47 352,56 456,23 560,9" />

                  <!-- area under line (subtle) -->
                  <path d="M40 93 L144 70 L248 47 L352 56 L456 23 L560 9 L560 180 L40 180 Z" fill="rgba(0,157,218,0.06)" />

                  <!-- points -->
                  <g class="points" fill="var(--card-border-color)" stroke="#000" stroke-width="1">
                    <circle cx="40" cy="93" r="4.5"></circle>
                    <circle cx="144" cy="70" r="4.5"></circle>
                    <circle cx="248" cy="47" r="4.5"></circle>
                    <circle cx="352" cy="56" r="4.5"></circle>
                    <circle cx="456" cy="23" r="4.5"></circle>
                    <circle cx="560" cy="9" r="4.5"></circle>
                  </g>
                </svg>
              </div>
            </div>
          </section>

          <section class="recent-sessions" aria-label="Recent sessions">
            <div class="recent-box">
              <h3 class="recent-title">Recent Sessions</h3>
              <div class="sessions-list">
                <div class="session-row">
                  <div class="session-mode">Chord Completion</div>
                  <div class="session-accuracy">80%</div>
                  <div class="session-meta">2 min · Beginner</div>
                </div>
                <div class="session-row">
                  <div class="session-mode">Unison</div>
                  <div class="session-accuracy">75%</div>
                  <div class="session-meta">1.5 min · Intermediate</div>
                </div>
                <div class="session-row">
                  <div class="session-mode">Chord Completion</div>
                  <div class="session-accuracy">82%</div>
                  <div class="session-meta">3 min · Beginner</div>
                </div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>
  </ion-content>
</div>
